# ESF CyberShield — portfolio deployment topology.
# frontend -> backend -> SQLite on a persistent named volume.
# PostgreSQL below is retained dormant for a future production profile;
# the application does not use it (DATABASE_URL points at SQLite).
# backend / frontend images build from ./backend and ./frontend.

services:
  postgres:
    image: postgres:16-alpine
    container_name: esf-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esf}
      POSTGRES_USER: ${POSTGRES_USER:-esf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-esf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Planned (do not uncomment until Dockerfiles exist):
  # ml:         # build: ./ml, batch/inference jobs
  # neo4j:      # image: neo4j:5, attack graph
  # chroma:     # image: chromadb/chroma, vector store
  # ollama:     # image: ollama/ollama, local LLM

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esf-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/esf.db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - esf-sqlite:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time only (Next.js inlines NEXT_PUBLIC_* at build).
        # Override per deployment, e.g. FRONTEND_API_URL=https://api.example.com.
        NEXT_PUBLIC_API_BASE_URL: ${FRONTEND_API_URL:-http://localhost:8000}
    container_name: esf-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # One-off demo seeding (excluded from `up` by profile). Reuses the backend
  # image (Python + dependencies only); demo assets are bind-mounted read-only
  # so the production image stays free of datasets and model files.
  # Usage: first `docker compose run --rm backend alembic upgrade head`,
  # then `docker compose --profile seed run --rm seed`.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["seed"]
    environment:
      DATABASE_URL: sqlite:////data/esf.db
      SEED_BACKEND_DIR: /srv/app
      SEED_DATA_FILE: /seed/data/sample_demo.jsonl
      SEED_MODEL_FILE: /seed/models/model.joblib
    volumes:
      - esf-sqlite:/data
      - ./scripts:/seed/scripts:ro
      - ./models/ueba:/seed/models:ro
      - ./data/synthetic:/seed/data:ro
    command: ["python", "/seed/scripts/seed_demo.py"]

volumes:
  pgdata:
  esf-sqlite:

networks:
  default:
    name: esf-net
